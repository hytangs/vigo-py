[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigo-router"
version = "0.3.0"
description = "Python interface to VIGO for scheduled-network compilation, routing, one-to-many analysis, and isochrones."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { file = "LICENSE" }
keywords = ["gtfs", "public-transit", "routing", "transportation", "vigo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
VIGO = "https://github.com/hytangs/vigo"
Repository = "https://github.com/hytangs/vigo-py"
Documentation = "https://github.com/hytangs/vigo-py#readme"
Issues = "https://github.com/hytangs/vigo-py/issues"

[project.scripts]
vigo-router = "vigo_router.cli:main"
vigo-router-download = "vigo_router.runtime:main"

[tool.setuptools.packages.find]
include = ["vigo_router*"]
