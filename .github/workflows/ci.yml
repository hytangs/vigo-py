name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Check code
        run: python -m ruff check vigo tests scripts
      - name: Run tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q
      - name: Check notebooks
        run: python scripts/check-notebooks.py
      - name: Check public source
        run: python scripts/check-public-release.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
