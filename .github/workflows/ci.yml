name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install mypy pytest ruff tqdm
      - name: Check code
        run: python -m ruff check vigo tests scripts
      - name: Check types
        run: python -m mypy vigo
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q
      - name: Check notebooks
        run: python scripts/check-notebooks.py
      - name: Check public source
        run: python scripts/check-public-release.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Check installed wheel
        run: python scripts/check-wheel.py dist

  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: hytangs/vigo
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          path: engine
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: engine/.nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install ".[progress]" pytest
      - run: npm ci
        working-directory: engine
      - run: npm run build:studio
        working-directory: engine
      - name: Prepare public fixture and select packaged runtime
        working-directory: engine
        run: node ../scripts/prepare-integration.mjs
      - run: python -m pytest tests/test_live_runtime.py -q

  release:
    if: github.ref_type == 'tag'
    needs: [test, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Publish verified wheel and source archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "VIGO Python ${{ github.ref_name }}" --notes-file docs/releases/0.3.1.md
