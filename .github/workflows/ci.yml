name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -t . -p 'test_vigo_router*.py'
      - name: Check notebooks
        run: python scripts/check-notebooks.py
      - name: Check public boundary
        run: python scripts/check-public-release.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
