name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -t . -p 'test_vigo_router*.py'
      - name: Check notebooks
        run: python scripts/check-notebooks.py
      - name: Check public boundary
        run: python scripts/check-public-release.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

  live-runtime:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: macos-14
    timeout-minutes: 20
    env:
      VIGO_ROUTER_RUNTIME_DIR: ${{ runner.temp }}/vigo-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require Apple-silicon runner
        run: python -c 'import platform; assert platform.system() == "Darwin" and platform.machine() == "arm64", platform.platform()'
      - name: Build and install wheel outside the source package
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv "$RUNNER_TEMP/vigo-python-integration"
          "$RUNNER_TEMP/vigo-python-integration/bin/python" -m pip install --no-deps dist/vigo_router-*.whl
      - name: Download and verify the pinned VIGO runtime
        run: "$RUNNER_TEMP/vigo-python-integration/bin/vigo-router-download"
      - name: Compile GTFS and OSM, then run a real route
        run: |
          "$RUNNER_TEMP/vigo-python-integration/bin/python" -I scripts/check-live-runtime.py
